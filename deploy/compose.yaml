services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      DB_PATH: /data/word-atlas.sqlite
      ATLAS_INDEX_PATH: /app/index.json
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:18088}
      REWRITTEN_ORIGINS: ${REWRITTEN_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ../dist-server/server.mjs:/app/server.mjs:ro
      - ../public/atlas/index.json:/app/index.json:ro
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    ports:
      - "${ATLAS_PORT:-18088}:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
